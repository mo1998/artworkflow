# ArtWorkflow pipeline configuration.
#
# Every tool path is explicit so the pipeline never depends on PATH or on which
# virtualenv happens to be active. All paths are resolved relative to the project
# root unless they start with ~ or /.

project: artworkflow

paths:
  incoming: assets/incoming # raw generator output (never overwritten by later stages)
  processed: assets/processed # transparent / cropped / resized
  animations: assets/animations # rendered frame sequences
  spritesheets: assets/spritesheets # packed sheets + frame metadata
  approved: assets/approved # passed validation, ready for the engine
  records: metadata/asset_records # one JSON record per asset
  manifests: metadata/manifests # per-run manifest snapshots
  logs: logs
  reports: reports

comfyui:
  url: http://127.0.0.1:8188
  # Blank means "find it": COMFYUI_HOME, then ~/comfy/ComfyUI, ~/ComfyUI, /opt/ComfyUI.
  # Override in config/pipeline.local.yaml (untracked) or with the environment variable.
  home: ""
  # Blank means "find a python that can import torch": the checkout's venv, a conda env named
  # comfy*, or the interpreter running the pipeline.
  python: ""
  autostart: true # start the server if the API is not reachable
  extra_args: ["--disable-auto-launch"]
  startup_timeout_seconds: 420
  poll_interval_seconds: 2
  job_timeout_seconds: 900
  background_removal:
    # Standalone `rembg`/onnxruntime are optional; the ComfyUI_BiRefNet_ll custom node is the
    # supported cutout path and needs no extra python package.
    node_pack: ComfyUI_BiRefNet_ll
    model_name: General-HR
    process_width: 1024
    process_height: 1024

blender:
  binary: "" # blank = BLENDER_BIN, then PATH, then ~/blender*/blender-*/blender
  engine: BLENDER_EEVEE_NEXT # EEVEE renders headless without a display; Cycles also works
  default_samples: 64

godot:
  binary: "" # blank = GODOT_BIN, then PATH, then ~/.local/bin/godot
  project_dir: godot_project
  import_timeout_seconds: 300
  check_timeout_seconds: 180

retry:
  generation: 2
  processing: 1
  background_removal: 1
  validation: 0

concurrency:
  gpu_jobs: 1 # ComfyUI and Blender both want the GPU; serialize them

validation:
  blank_stddev_min: 4.0 # below this the image is a flat wash
  alpha_coverage:
    min: 0.02 # subject must exist
    max: 0.97 # subject must not be the whole frame
  border_touch_tolerance_px: 1 # isolated subjects may not be flush with the edge
  source_border_margin_px: 2 # the *render* must leave this much room; trim would hide clipping
  min_subject_short_side_px: 48
  duplicate_hamming_distance: 6 # dHash bits; <= this counts as a near-duplicate
  frame:
    centroid_jitter_max_px: 24
    alpha_coverage_ratio_max: 0.25
    # Motion is judged by peak per-pixel change plus the share of pixels that moved, not by a
    # mean over the canvas: a small animated detail on a large sprite is still real animation.
    min_changed_pixel_fraction: 0.0005 # 0.05% of the canvas must change
    min_peak_delta: 8 # and at least one pixel must change by 8/255

review:
  # Aesthetic judgements the validator cannot make: flag instead of passing.
  min_subject_fill_ratio: 0.15 # subject smaller than this share of the canvas
  max_subject_fill_ratio: 0.92 # subject larger than this leaves no breathing room
